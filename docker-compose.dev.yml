version: '3.8'

services:
  # Banco de dados PostgreSQL para desenvolvimento
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: lojad_main
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - lojad_network

  # Redis para desenvolvimento
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - lojad_network

  # Aplicação Django para desenvolvimento
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DB_HOST=db
      - DB_NAME=lojad_main
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - db
      - redis
    networks:
      - lojad_network

  # Worker do Celery para desenvolvimento
  celery:
    build: .
    command: celery -A lojad worker --loglevel=debug
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - DB_HOST=db
      - DB_NAME=lojad_main
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - db
      - redis
    networks:
      - lojad_network

  # Beat do Celery para desenvolvimento
  celery-beat:
    build: .
    command: celery -A lojad beat --loglevel=debug
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - DB_HOST=db
      - DB_NAME=lojad_main
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - db
      - redis
    networks:
      - lojad_network

volumes:
  postgres_data:

networks:
  lojad_network:
    driver: bridge







