<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FATESA - Portal Acadêmico{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            /* Cores FATESA */
            --fatesa-azul-principal: #1e3a8a;
            --fatesa-azul-secundario: #3b82f6;
            --fatesa-verde-accent: #10b981;
            --fatesa-cinza-claro: #f8fafc;
            --fatesa-cinza-medio: #64748b;
            --fatesa-cinza-escuro: #1e293b;
            --fatesa-branco: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--fatesa-cinza-claro) 0%, #ffffff 100%);
            min-height: 100vh;
            color: var(--fatesa-cinza-escuro);
        }

        .main-content {
            padding: 0;
            min-height: 100vh;
        }

        .container-fluid {
            padding: 0;
        }

        .card {
            border: none;
            box-shadow: 0 4px 20px rgba(30, 58, 138, 0.08);
            border-radius: 12px;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--fatesa-azul-principal), var(--fatesa-azul-secundario));
            color: var(--fatesa-branco);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 8px 32px rgba(30, 58, 138, 0.2);
            border: none;
            margin-bottom: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(30, 58, 138, 0.3);
        }

        .stat-card.success {
            background: linear-gradient(135deg, var(--fatesa-verde-accent), #059669);
        }

        .stat-card.warning {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }

        .stat-card.info {
            background: linear-gradient(135deg, var(--fatesa-azul-secundario), #2563eb);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--fatesa-azul-principal), var(--fatesa-azul-secundario));
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(30, 58, 138, 0.3);
        }

        .alert {
            border: none;
            border-radius: 12px;
            border-left: 4px solid;
        }

        .alert-success {
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
            border-left-color: var(--fatesa-verde-accent);
            color: #065f46;
        }

        .alert-info {
            background: linear-gradient(135deg, #dbeafe, #bfdbfe);
            border-left-color: var(--fatesa-azul-secundario);
            color: #1e40af;
        }

        .alert-warning {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            border-left-color: #f59e0b;
            color: #92400e;
        }

        .alert-danger {
            background: linear-gradient(135deg, #fee2e2, #fecaca);
            border-left-color: #dc2626;
            color: #991b1b;
        }

        /* Barra superior minimalista */
        .top-bar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(30, 58, 138, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 10px rgba(30, 58, 138, 0.05);
        }

        .top-bar .btn {
            border-radius: 20px;
            font-size: 0.875rem;
        }

        /* Container de mensagens */
        .messages-container {
            position: fixed;
            top: 70px;
            right: 20px;
            z-index: 1050;
            max-width: 400px;
        }

        .messages-container .alert {
            margin-bottom: 0.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        /* Estilo para conteúdo principal */
        .content-wrapper {
            padding: 2rem;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding-top: 1rem;
        }

        /* Remover navbar padrão do sistema */
        .navbar:not(.top-bar), .nav:not(.top-bar *), .navigation, .header-nav {
            display: none !important;
        }

        /* Animações suaves */
        .fade-in {
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .content-wrapper {
                padding: 1rem;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>
    <!-- Barra superior minimalista com logout -->
    <div class="top-bar">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center py-2">
                <div class="d-flex align-items-center">
                    <i class="fas fa-graduation-cap text-primary me-2"></i>
                    <span class="fw-bold text-primary">FATESA</span>
                </div>
                <div class="dropdown">
                    <button class="btn btn-outline-primary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        <i class="fas fa-user-circle me-1"></i>
                        {{ user.username|truncatechars:20 }}
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="{% url 'avaliacao_qualidade:meu_perfil' %}">
                                <i class="fas fa-user me-2"></i> Meu Perfil
                            </a></li>
                        <li><a class="dropdown-item" href="{% url 'avaliacao_qualidade:alterar_minha_senha' %}">
                                <i class="fas fa-key me-2"></i> Alterar Senha
                            </a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="{% url 'dashboard:logout' %}">
                                <i class="fas fa-sign-out-alt me-2"></i> Sair
                            </a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid">
        <!-- Messages -->
        {% if messages %}
        <div class="messages-container">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                <i class="fas fa-{% if message.tags == 'success' %}check-circle{% elif message.tags == 'error' %}exclamation-triangle{% elif message.tags == 'warning' %}exclamation-triangle{% else %}info-circle{% endif %} me-2"></i>
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <div class="main-content">
            <div class="content-wrapper fade-in">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Scripts FATESA -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Auto-dismiss alerts after 5 seconds
            const alerts = document.querySelectorAll('.alert');
            alerts.forEach(function (alert) {
                setTimeout(function () {
                    if (alert && !alert.classList.contains('fade')) {
                        const bsAlert = new bootstrap.Alert(alert);
                        bsAlert.close();
                    }
                }, 5000);
            });

            // Smooth scroll para links internos
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function (e) {
                    e.preventDefault();
                    const target = document.querySelector(this.getAttribute('href'));
                    if (target) {
                        target.scrollIntoView({
                            behavior: 'smooth',
                            block: 'start'
                        });
                    }
                });
            });

            // Confirmação para ações de exclusão
            document.querySelectorAll('.btn-danger, .delete-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    if (!confirm('Tem certeza que deseja realizar esta ação?')) {
                        e.preventDefault();
                    }
                });
            });

            // Loading state para formulários
            document.querySelectorAll('form').forEach(form => {
                form.addEventListener('submit', function() {
                    const submitBtn = form.querySelector('button[type="submit"]');
                    if (submitBtn) {
                        submitBtn.disabled = true;
                        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Processando...';
                    }
                });
            });
        });

        // Função para mostrar notificações toast
        function showToast(message, type = 'info') {
            const toastContainer = document.getElementById('toast-container') || createToastContainer();
            const toast = document.createElement('div');
            toast.className = `toast align-items-center text-white bg-${type} border-0`;
            toast.setAttribute('role', 'alert');
            toast.innerHTML = `
                <div class="d-flex">
                    <div class="toast-body">
                        <i class="fas fa-${type === 'success' ? 'check' : type === 'danger' ? 'times' : 'info'}-circle me-2"></i>
                        ${message}
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            `;
            toastContainer.appendChild(toast);
            const bsToast = new bootstrap.Toast(toast);
            bsToast.show();
            
            toast.addEventListener('hidden.bs.toast', () => {
                toast.remove();
            });
        }

        function createToastContainer() {
            const container = document.createElement('div');
            container.id = 'toast-container';
            container.className = 'toast-container position-fixed bottom-0 end-0 p-3';
            container.style.zIndex = '1055';
            document.body.appendChild(container);
            return container;
        }
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
