{% extends 'base.html' %}

{% block title %}Erro de Navegação{% endblock %}
{% block page_title %}Erro de Navegação{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="text-center">
                <div class="error mx-auto" data-text="500">500</div>
                <p class="lead text-gray-800 mb-5">Erro Interno do Servidor</p>
                <p class="text-gray-500 mb-0">{{ error_message }}</p>
                <a href="{% url 'dashboard:principal' %}">&larr; Voltar ao Dashboard</a>
            </div>
        </div>
    </div>
</div>

<style>
.error {
    font-size: 7rem;
    position: relative;
    line-height: 1;
    width: 12.5rem;
}

.error:before {
    content: attr(data-text);
    position: absolute;
    left: 0;
    top: 0;
    color: #eaecf4;
    width: 100%;
    overflow: hidden;
    pointer-events: none;
}
</style>
{% endblock %}
