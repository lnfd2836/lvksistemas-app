{% extends 'base.html' %}
{% load static %}

{% block title %}Erro na Assinatura{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">❌ Erro na Assinatura</h4>
                </div>
                <div class="card-body text-center">
                    <div class="alert alert-danger">
                        <h5>Ocorreu um erro ao processar a assinatura</h5>
                        <p>{{ erro|default:"Erro interno do servidor" }}</p>
                    </div>

                    <div class="alert alert-info mt-4">
                        <p class="mb-0">
                            📞 Entre em contato conosco para resolver este problema.
                        </p>
                    </div>

                    <button type="button" class="btn btn-secondary mt-3" onclick="window.close()">
                        Fechar Janela
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
