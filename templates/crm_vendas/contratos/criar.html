{% extends 'base.html' %}
{% load widget_tweaks %}

{% block title %}Criar Contrato - CRM{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">
                        <i class="fas fa-file-contract me-2"></i>
                        Criar Contrato
                    </h3>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="lead_id" class="form-label">Lead</label>
                                    <select name="lead_id" id="lead_id" class="form-select" required>
                                        <option value="">Selecione um lead</option>
                                        {% for lead in leads %}
                                        <option value="{{ lead.id }}">{{ lead.nome }} - {{ lead.empresa }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="titulo" class="form-label">Título</label>
                                    <input type="text" name="titulo" id="titulo" class="form-control" required>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="descricao" class="form-label">Descrição</label>
                            <textarea name="descricao" id="descricao" class="form-control" rows="4"></textarea>
                        </div>
                        
                        <!-- Seção de Serviços/Produtos -->
                        <div class="card mb-4">
                            <div class="card-header">
                                <h5 class="mb-0">
                                    <i class="fas fa-list me-2"></i>
                                    Produtos/Serviços do Contrato
                                </h5>
                            </div>
                            <div class="card-body">
                                <div id="servicos-contrato-container">
                                    <div class="servico-contrato-row mb-3" data-index="0">
                                        <div class="row">
                                            <div class="col-md-6">
                                                <label class="form-label">Nome do Serviço/Produto</label>
                                                <input type="text" name="servicos_contrato[0][nome]" class="form-control" placeholder="Ex: Manutenção de Sistema" required>
                                            </div>
                                            <div class="col-md-4">
                                                <label class="form-label">Valor</label>
                                                <input type="number" name="servicos_contrato[0][valor]" class="form-control valor-servico-contrato" step="0.01" min="0">
                                            </div>
                                            <div class="col-md-2 d-flex align-items-end">
                                                <button type="button" class="btn btn-danger btn-sm remover-servico-contrato" style="display: none;">
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            </div>
                                        </div>
                                        <div class="row mt-2">
                                            <div class="col-12">
                                                <label class="form-label">Descrição Detalhada (opcional)</label>
                                                <textarea name="servicos_contrato[0][descricao]" class="form-control" rows="2" placeholder="Detalhes sobre o serviço/produto contratado..."></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="d-flex justify-content-between align-items-center">
                                    <button type="button" id="adicionar-servico-contrato" class="btn btn-success btn-sm">
                                        <i class="fas fa-plus me-1"></i>
                                        Adicionar Produto/Serviço
                                    </button>
                                    
                                    <div class="text-end">
                                        <strong>Valor Total: R$ <span id="valor-total-contrato">0,00</span></strong>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="data_inicio" class="form-label">Data de Início</label>
                                    <input type="date" name="data_inicio" id="data_inicio" class="form-control">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="data_fim" class="form-label">Data de Fim</label>
                                    <input type="date" name="data_fim" id="data_fim" class="form-control">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="prazo_meses" class="form-label">Prazo (meses)</label>
                                    <input type="number" name="prazo_meses" id="prazo_meses" class="form-control" value="12">
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="condicoes" class="form-label">Condições</label>
                            <textarea name="condicoes" id="condicoes" class="form-control" rows="4"></textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label for="observacoes" class="form-label">Observações</label>
                            <textarea name="observacoes" id="observacoes" class="form-control" rows="3"></textarea>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'crm_vendas:listar_contratos' %}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Criar Contrato</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
$(document).ready(function() {
    let servicoContratoIndex = 1;
    
    // Função para calcular valor total do contrato
    function calcularValorTotalContrato() {
        let total = 0;
        $('.valor-servico-contrato').each(function() {
            total += parseFloat($(this).val()) || 0;
        });
        
        $('#valor-total-contrato').text(total.toLocaleString('pt-BR', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }));
    }
    
    // Adicionar novo serviço ao contrato
    $('#adicionar-servico-contrato').click(function() {
        const novoServicoContrato = `
            <div class="servico-contrato-row mb-3" data-index="${servicoContratoIndex}">
                <div class="row">
                    <div class="col-md-6">
                        <label class="form-label">Nome do Serviço/Produto</label>
                        <input type="text" name="servicos_contrato[${servicoContratoIndex}][nome]" class="form-control" placeholder="Ex: Suporte Técnico" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Valor</label>
                        <input type="number" name="servicos_contrato[${servicoContratoIndex}][valor]" class="form-control valor-servico-contrato" step="0.01" min="0">
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="button" class="btn btn-danger btn-sm remover-servico-contrato">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
                <div class="row mt-2">
                    <div class="col-12">
                        <label class="form-label">Descrição Detalhada (opcional)</label>
                        <textarea name="servicos_contrato[${servicoContratoIndex}][descricao]" class="form-control" rows="2" placeholder="Detalhes sobre o serviço/produto contratado..."></textarea>
                    </div>
                </div>
            </div>
        `;
        
        $('#servicos-contrato-container').append(novoServicoContrato);
        servicoContratoIndex++;
        
        // Mostrar botão de remover se houver mais de um serviço
        if ($('.servico-contrato-row').length > 1) {
            $('.remover-servico-contrato').show();
        }
    });
    
    // Remover serviço do contrato
    $(document).on('click', '.remover-servico-contrato', function() {
        $(this).closest('.servico-contrato-row').remove();
        calcularValorTotalContrato();
        
        // Esconder botão de remover se houver apenas um serviço
        if ($('.servico-contrato-row').length <= 1) {
            $('.remover-servico-contrato').hide();
        }
    });
    
    // Calcular valores quando valor mudar
    $(document).on('input', '.valor-servico-contrato', function() {
        calcularValorTotalContrato();
    });
    
    // Calcular valor inicial
    calcularValorTotalContrato();
    
    // Validação do formulário
    $('form').on('submit', function(e) {
        let valid = true;
        
        // Verificar se há pelo menos um produto/serviço
        if ($('.servico-contrato-row').length === 0) {
            alert('Adicione pelo menos um produto/serviço ao contrato.');
            e.preventDefault();
            return false;
        }
        
        // Verificar se todos os serviços têm nome
        $('.servico-contrato-row').each(function() {
            const nome = $(this).find('input[name*="[nome]"]').val().trim();
            
            if (!nome) {
                alert('Todos os produtos/serviços devem ter um nome.');
                valid = false;
                return false;
            }
        });
        
        if (!valid) {
            e.preventDefault();
        }
    });
});
</script>
{% endblock %}
