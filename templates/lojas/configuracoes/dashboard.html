<form method="post" action="{% url 'lojas:salvar_config_dashboard' loja.id %}" class="config-form">
    {% csrf_token %}
    
    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title">Widgets Habilitados</h5>
                </div>
                <div class="card-body">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="widgets_habilitados" 
                               value="vendas_hoje" id="widget_vendas_hoje"
                               {% if 'vendas_hoje' in config_dashboard.widgets_habilitados %}checked{% endif %}>
                        <label class="form-check-label" for="widget_vendas_hoje">Vendas de Hoje</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="widgets_habilitados" 
                               value="vendas_mes" id="widget_vendas_mes"
                               {% if 'vendas_mes' in config_dashboard.widgets_habilitados %}checked{% endif %}>
                        <label class="form-check-label" for="widget_vendas_mes">Vendas do Mês</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="widgets_habilitados" 
                               value="clientes_novos" id="widget_clientes_novos"
                               {% if 'clientes_novos' in config_dashboard.widgets_habilitados %}checked{% endif %}>
                        <label class="form-check-label" for="widget_clientes_novos">Clientes Novos</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="widgets_habilitados" 
                               value="produtos_mais_vendidos" id="widget_produtos_vendidos"
                               {% if 'produtos_mais_vendidos' in config_dashboard.widgets_habilitados %}checked{% endif %}>
                        <label class="form-check-label" for="widget_produtos_vendidos">Produtos Mais Vendidos</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="widgets_habilitados" 
                               value="estoque_baixo" id="widget_estoque_baixo"
                               {% if 'estoque_baixo' in config_dashboard.widgets_habilitados %}checked{% endif %}>
                        <label class="form-check-label" for="widget_estoque_baixo">Produtos com Estoque Baixo</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="widgets_habilitados" 
                               value="metas_vendas" id="widget_metas_vendas"
                               {% if 'metas_vendas' in config_dashboard.widgets_habilitados %}checked{% endif %}>
                        <label class="form-check-label" for="widget_metas_vendas">Metas de Vendas</label>
                    </div>
                </div>
            </div>
            
            <div class="card mt-3">
                <div class="card-header">
                    <h5 class="card-title">Layout</h5>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label for="layout_colunas" class="form-label">Número de Colunas</label>
                        <select class="form-select" name="layout_colunas" id="layout_colunas">
                            <option value="2" {% if config_dashboard.layout_colunas == 2 %}selected{% endif %}>2 Colunas</option>
                            <option value="3" {% if config_dashboard.layout_colunas == 3 %}selected{% endif %}>3 Colunas</option>
                            <option value="4" {% if config_dashboard.layout_colunas == 4 %}selected{% endif %}>4 Colunas</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="tema_cores" class="form-label">Tema de Cores</label>
                        <select class="form-select" name="tema_cores" id="tema_cores">
                            <option value="padrao" {% if config_dashboard.tema_cores == 'padrao' %}selected{% endif %}>Padrão</option>
                            <option value="azul" {% if config_dashboard.tema_cores == 'azul' %}selected{% endif %}>Azul</option>
                            <option value="verde" {% if config_dashboard.tema_cores == 'verde' %}selected{% endif %}>Verde</option>
                            <option value="roxo" {% if config_dashboard.tema_cores == 'roxo' %}selected{% endif %}>Roxo</option>
                            <option value="escuro" {% if config_dashboard.tema_cores == 'escuro' %}selected{% endif %}>Escuro</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title">Período Padrão</h5>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label for="periodo_padrao" class="form-label">Período de Análise</label>
                        <select class="form-select" name="periodo_padrao" id="periodo_padrao">
                            <option value="hoje" {% if config_dashboard.periodo_padrao == 'hoje' %}selected{% endif %}>Hoje</option>
                            <option value="semana_atual" {% if config_dashboard.periodo_padrao == 'semana_atual' %}selected{% endif %}>Semana Atual</option>
                            <option value="mes_atual" {% if config_dashboard.periodo_padrao == 'mes_atual' %}selected{% endif %}>Mês Atual</option>
                            <option value="trimestre_atual" {% if config_dashboard.periodo_padrao == 'trimestre_atual' %}selected{% endif %}>Trimestre Atual</option>
                            <option value="ano_atual" {% if config_dashboard.periodo_padrao == 'ano_atual' %}selected{% endif %}>Ano Atual</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="card mt-3">
                <div class="card-header">
                    <h5 class="card-title">Métricas Principais</h5>
                </div>
                <div class="card-body">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="metricas_principais" 
                               value="faturamento" id="metrica_faturamento"
                               {% if 'faturamento' in config_dashboard.metricas_principais %}checked{% endif %}>
                        <label class="form-check-label" for="metrica_faturamento">Faturamento</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="metricas_principais" 
                               value="ticket_medio" id="metrica_ticket_medio"
                               {% if 'ticket_medio' in config_dashboard.metricas_principais %}checked{% endif %}>
                        <label class="form-check-label" for="metrica_ticket_medio">Ticket Médio</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="metricas_principais" 
                               value="quantidade_vendas" id="metrica_quantidade_vendas"
                               {% if 'quantidade_vendas' in config_dashboard.metricas_principais %}checked{% endif %}>
                        <label class="form-check-label" for="metrica_quantidade_vendas">Quantidade de Vendas</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="metricas_principais" 
                               value="crescimento" id="metrica_crescimento"
                               {% if 'crescimento' in config_dashboard.metricas_principais %}checked{% endif %}>
                        <label class="form-check-label" for="metrica_crescimento">% Crescimento</label>
                    </div>
                </div>
            </div>
            
            <div class="card mt-3">
                <div class="card-header">
                    <h5 class="card-title">Gráficos</h5>
                </div>
                <div class="card-body">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="graficos_habilitados" 
                               value="vendas_tempo" id="grafico_vendas_tempo"
                               {% if 'vendas_tempo' in config_dashboard.graficos_habilitados %}checked{% endif %}>
                        <label class="form-check-label" for="grafico_vendas_tempo">Vendas ao Longo do Tempo</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="graficos_habilitados" 
                               value="produtos_categoria" id="grafico_produtos_categoria"
                               {% if 'produtos_categoria' in config_dashboard.graficos_habilitados %}checked{% endif %}>
                        <label class="form-check-label" for="grafico_produtos_categoria">Vendas por Categoria</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="graficos_habilitados" 
                               value="formas_pagamento" id="grafico_formas_pagamento"
                               {% if 'formas_pagamento' in config_dashboard.graficos_habilitados %}checked{% endif %}>
                        <label class="form-check-label" for="grafico_formas_pagamento">Formas de Pagamento</label>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="row mt-3">
        <div class="col-12">
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-1"></i>Salvar Configurações de Dashboard
                </button>
                <a href="{% url 'lojas:preview_dashboard' loja.id %}" class="btn btn-outline-info" target="_blank">
                    <i class="fas fa-eye me-1"></i>Visualizar Preview
                </a>
            </div>
        </div>
    </div>
</form>
