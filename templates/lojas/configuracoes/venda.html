<form method="post" action="{% url 'lojas:salvar_config_venda' loja.id %}" class="config-form">
    {% csrf_token %}
    
    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title">Numeração de Vendas</h5>
                </div>
                <div class="card-body">
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" name="numeracao_automatica" 
                               id="numeracao_automatica" {% if config_venda.numeracao_automatica %}checked{% endif %}>
                        <label class="form-check-label" for="numeracao_automatica">
                            Numeração automática
                        </label>
                    </div>
                    
                    <div class="mb-3">
                        <label for="prefixo_numero" class="form-label">Prefixo do Número</label>
                        <input type="text" class="form-control" name="prefixo_numero" 
                               id="prefixo_numero" maxlength="10"
                               value="{{ config_venda.prefixo_numero }}">
                        <div class="form-text">Ex: VND, VENDA, etc.</div>
                    </div>
                </div>
            </div>
            
            <div class="card mt-3">
                <div class="card-header">
                    <h5 class="card-title">Configurações de Desconto</h5>
                </div>
                <div class="card-body">
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" name="permite_desconto" 
                               id="permite_desconto" {% if config_venda.permite_desconto %}checked{% endif %}>
                        <label class="form-check-label" for="permite_desconto">
                            Permitir desconto nas vendas
                        </label>
                    </div>
                    
                    <div class="mb-3">
                        <label for="desconto_maximo_percentual" class="form-label">Desconto Máximo (%)</label>
                        <input type="number" class="form-control" name="desconto_maximo_percentual" 
                               id="desconto_maximo_percentual" step="0.01" min="0" max="100"
                               value="{{ config_venda.desconto_maximo_percentual|default:'' }}">
                    </div>
                </div>
            </div>
        </div>
        
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title">Configurações Gerais</h5>
                </div>
                <div class="card-body">
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" name="exige_cliente" 
                               id="exige_cliente" {% if config_venda.exige_cliente %}checked{% endif %}>
                        <label class="form-check-label" for="exige_cliente">
                            Exigir cliente na venda
                        </label>
                    </div>
                    
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" name="baixa_estoque_automatica" 
                               id="baixa_estoque_automatica" {% if config_venda.baixa_estoque_automatica %}checked{% endif %}>
                        <label class="form-check-label" for="baixa_estoque_automatica">
                            Baixar estoque automaticamente
                        </label>
                    </div>
                    
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" name="permite_venda_sem_estoque" 
                               id="permite_venda_sem_estoque" {% if config_venda.permite_venda_sem_estoque %}checked{% endif %}>
                        <label class="form-check-label" for="permite_venda_sem_estoque">
                            Permitir venda sem estoque
                        </label>
                    </div>
                </div>
            </div>
            
            <div class="card mt-3">
                <div class="card-header">
                    <h5 class="card-title">Formas de Pagamento</h5>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label">Formas de Pagamento Disponíveis</label>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="formas_pagamento" 
                                   value="dinheiro" id="pagamento_dinheiro"
                                   {% if 'dinheiro' in config_venda.formas_pagamento_disponiveis %}checked{% endif %}>
                            <label class="form-check-label" for="pagamento_dinheiro">Dinheiro</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="formas_pagamento" 
                                   value="cartao_credito" id="pagamento_cartao_credito"
                                   {% if 'cartao_credito' in config_venda.formas_pagamento_disponiveis %}checked{% endif %}>
                            <label class="form-check-label" for="pagamento_cartao_credito">Cartão de Crédito</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="formas_pagamento" 
                                   value="cartao_debito" id="pagamento_cartao_debito"
                                   {% if 'cartao_debito' in config_venda.formas_pagamento_disponiveis %}checked{% endif %}>
                            <label class="form-check-label" for="pagamento_cartao_debito">Cartão de Débito</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="formas_pagamento" 
                                   value="pix" id="pagamento_pix"
                                   {% if 'pix' in config_venda.formas_pagamento_disponiveis %}checked{% endif %}>
                            <label class="form-check-label" for="pagamento_pix">PIX</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="formas_pagamento" 
                                   value="boleto" id="pagamento_boleto"
                                   {% if 'boleto' in config_venda.formas_pagamento_disponiveis %}checked{% endif %}>
                            <label class="form-check-label" for="pagamento_boleto">Boleto</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="formas_pagamento" 
                                   value="prazo" id="pagamento_prazo"
                                   {% if 'prazo' in config_venda.formas_pagamento_disponiveis %}checked{% endif %}>
                            <label class="form-check-label" for="pagamento_prazo">A Prazo</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="row mt-3">
        <div class="col-12">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save me-1"></i>Salvar Configurações de Venda
            </button>
        </div>
    </div>
</form>
